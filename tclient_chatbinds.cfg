bindchat_ex "!mban" "i[id] s[time] r[reason]" "Ban someone" "rcon set_team \{0\} -1;webhook_command ban \{0\} \{1\} \{2\}"
bindchat "!mhideauth" "exec scripts/rcon/auth_hide.cfg"
bindchat "!mhideips" "exec scripts/rcon/ips_hide.cfg"
bindchat "!mshowauth" "exec scripts/rcon/auth_show.cfg"
bindchat "!mshowips" "exec scripts/rcon/ips_show.cfg"
