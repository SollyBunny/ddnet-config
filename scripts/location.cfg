ifeq $(location) NW say [↖] Top Left / Oeberen Links / верхней левой
ifeq $(location) N say [↑] Top / Oberen / верхней
ifeq $(location) NE say [↗] Top Right / Oben Rechts / верхней правой
ifeq $(location) W say [←] Left / Linken / левой
ifeq $(location) C say [⊙] Center / Mittleren / центральной
ifeq $(location) E say [→] Right / Rechten / правой
ifeq $(location) SW say [↙] Bottom Left / Unteren Linken / нижней левой
ifeq $(location) S say [↓] Bottom / Unteren / нижней
ifeq $(location) SE say [↘] Bottom Right / Unteren rechten / нижней правой
